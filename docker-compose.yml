services:
  db:
    image: postgres:15-alpine
    container_name: soulbreach-db
    environment:
      POSTGRES_USER: user_soul
      POSTGRES_PASSWORD: password_breach
      POSTGRES_DB: soul_breach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s

volumes:
  postgres_data: